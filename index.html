

<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101827">
<title>فوتبالیست | فوتبال ایران</title>
<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Tahoma,Arial,sans-serif;
background:#101827;
color:#fff;
}
header{
background:#182438;
padding:22px 16px;
text-align:center;
border-bottom:1px solid #293950;
}
header h1{margin:0;color:#43d9a3;font-size:27px}
header p{color:#aab8ca;font-size:13px}
.container{max-width:850px;margin:auto;padding:18px}
h2{font-size:19px;margin-top:25px}
.search{
width:100%;padding:14px;border-radius:12px;
border:1px solid #34445c;background:#1b293d;
color:white;font-size:15px;outline:none;
}
.note{
background:#203248;padding:13px;border-radius:12px;
color:#cbd5e1;font-size:12px;line-height:2;
}
.clubs{
display:grid;grid-template-columns:repeat(2,1fr);
gap:12px;margin-top:15px;
}
.club{
background:#1b293d;border:1px solid #30425b;
border-radius:13px;padding:17px 10px;
text-align:center;cursor:pointer;
}
.club:hover{border-color:#43d9a3}
.club .logo{font-size:30px}
.club h3{font-size:14px;margin:9px 0 0}
button{
border:0;background:#43d9a3;color:#10251f;
padding:11px 16px;border-radius:9px;
font-weight:bold;cursor:pointer;
}
#details{
display:none;background:#1b293d;
padding:18px;border-radius:13px;margin-top:15px;
}
footer{text-align:center;color:#8493a8;padding:30px;font-size:12px}
</style>
</head>
<body>

<header>
<h1>⚽ فوتبالیست</h1>
<p>مرجع معرفی بازیکنان فوتبال ایران</p>
</header>

<main class="container">

<h2>جستجوی باشگاه</h2>
<input class="search" id="search"
placeholder="نام باشگاه را وارد کنید..."
oninput="filterClubs()">

<h2>باشگاه‌های لیگ برتر ایران</h2>

<div class="note">
اطلاعات باشگاه‌ها در این نسخه اولیه نمایشی است.
جدول واقعی لیگ و آمار بازیکنان در مراحل بعدی متصل خواهند شد.
</div>

<div class="clubs" id="clubs"></div>

<div id="details">
<h3 id="clubName"></h3>
<p>اطلاعات بازیکنان این باشگاه هنوز به منبع داده متصل نشده است.</p>
<button onclick="closeDetails()">بازگشت</button>
</div>

</main>

<footer>
فوتبالیست | نسخه آزمایشی
</footer>

<script>
const teams=[
"استقلال","پرسپولیس","سپاهان","تراکتور",
"فولاد خوزستان","گل‌گهر سیرجان","ذوب‌آهن",
"آلومینیوم اراک","ملوان بندرانزلی","شمس‌آذر قزوین",
"خیبر خرم‌آباد","چادرملو اردکان","مس رفسنجان",
"هوادار","نساجی مازندران","پیکان",
"صنعت نفت آبادان","استقلال خوزستان"
];

function showClubs(list){
const area=document.getElementById("clubs");
area.innerHTML="";
list.forEach(team=>{
const card=document.createElement("div");
card.className="club";
card.innerHTML="<div class='logo'>⚽</div><h3>"+team+"</h3>";
card.onclick=()=>openDetails(team);
area.appendChild(card);
});
}

function filterClubs(){
const q=document.getElementById("search").value.trim();
showClubs(teams.filter(t=>t.includes(q)));
}

function openDetails(name){
document.getElementById("clubName").textContent=name;
document.getElementById("details").style.display="block";
document.getElementById("details").scrollIntoView({behavior:"smooth"});
}

function closeDetails(){
document.getElementById("details").style.display="none";
}

showClubs(teams);
</script>
</body>
</html>
